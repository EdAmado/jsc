services:
  py:
    build: ./py
    volumes:
      - shared-data:/data
      - ./py:/app
    ports:
      - "5001:5001"
    networks:
      - jsc

  ui:
    image: nginx:alpine
    volumes:
      - shared-data:/usr/share/nginx/html/data
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./ui:/usr/share/nginx/html
    ports:
      - "3000:80"
    networks:
      - jsc

networks:
  jsc:
    driver: bridge

volumes:
  shared-data: